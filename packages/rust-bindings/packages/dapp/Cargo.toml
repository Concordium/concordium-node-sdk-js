[package]
name = "concordium_rust_bindings_dapp"
authors.workspace = true
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_json.workspace = true
wasm-bindgen = { workspace = true, optional = true }
anyhow.workspace = true
hex.workspace = true
serde-wasm-bindgen = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
concordium_base.workspace = true
concordium_rust_bindings_common = { workspace = true, default-features = false }

[lib]
name = "concordium_rust_bindings_dapp"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = ["wasm"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:getrandom", "concordium_rust_bindings_common/wasm"]
