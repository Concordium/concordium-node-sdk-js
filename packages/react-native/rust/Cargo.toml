[package]
name = "concordium_native"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.89"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
concordium_base = { path = "../../../deps/concordium-base/rust-src/concordium_base" }
key_derivation = { path = "../../../deps/concordium-base/rust-src/key_derivation" }
wallet_library = { path = "../../../deps/concordium-base/rust-src/wallet_library" }
futures-channel = "0.3"
getrandom = "0.2"
hex = "0.4"
serde_json = "1"
thiserror = "2"
uniffi = "=0.29.3"
anyhow = "1"
serde = "1"
concordium_rust_bindings_wallet = { path = "../../rust-bindings/packages/wallet", default-features = false }
concordium_rust_bindings_dapp = { path = "../../rust-bindings/packages/dapp", default-features = false }
